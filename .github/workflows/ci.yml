name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e0dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # stable toolchain action
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets
      - run: cargo build --workspace --release
      - run: cargo doc --workspace --no-deps

  offline-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e0dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # stable toolchain action
        with:
          toolchain: stable
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman
      - name: Pull the pinned local validation image
        run: |
          podman pull docker.io/library/rust@sha256:3490aa77d179a59d67e94239cca96dd84030b564470859200f535b942bdffedf
          podman pull registry.fedoraproject.org/fedora@sha256:23db2e5b6ca449c0d61f8085692f4d6e9d507283de854208a3d871d245e573cd
      - name: Build BLACKOUT
        run: cargo build --locked
      - name: Run offline acceptance flow
        env:
          BLACKOUT_SANDBOX_IMAGE: docker.io/library/rust@sha256:3490aa77d179a59d67e94239cca96dd84030b564470859200f535b942bdffedf
          BLACKOUT_PROBE_IMAGE: registry.fedoraproject.org/fedora@sha256:23db2e5b6ca449c0d61f8085692f4d6e9d507283de854208a3d871d245e573cd
        run: bash tests/integration/offline-flow.sh
